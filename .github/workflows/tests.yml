name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jasmine --filter regex; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node_version: ['lts/*', 'node', '14']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/unit/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/specs/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Build 🗜️
        if: matrix.node_version == '14'
        run: |
          sudo apt-get update && sudo apt-get install -y faketime
          faketime '2021-05-27 16:17:12' npm run build
          git status --porcelain
          git diff --stat
      - name: Pack
        if: matrix.node_version == '14'
        run: mkdir -p dist-pack && npm pack && mv marked-*.tgz dist-pack/
      - name: Upload tarball
        if: matrix.node_version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: dist-pack/marked-*.tgz
          if-no-files-found: error

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
